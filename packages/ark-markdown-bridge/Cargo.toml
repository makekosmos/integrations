[package]
name = "ark-markdown-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "ark-markdown-bridge"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
kepler-backend = { path = "../../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
