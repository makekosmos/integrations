name: publish

# Manual dispatch only: a catalog release rewrites what every Engine installs,
# so publication is an explicit, reviewed act rather than a side effect of a
# tag push. The orchestrator runs the first publish after this change merges.
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: "Catalog sequence (default: latest release + 1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pins
        id: toolchain
        run: node -p "const t = require('./toolchain.json'); `node=${t.node}\nrust=${t.rust}`" >> "$env:GITHUB_OUTPUT"
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ steps.toolchain.outputs.rust }} --profile minimal

      - name: Validate manifests and external apps
        run: node scripts/validate-manifests.mjs

      - name: Resolve catalog sequence
        id: sequence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $seq = "${{ inputs.sequence }}"
          if (-not $seq) {
            $prev = gh api repos/makekosmos/integrations/releases/latest --jq '.tag_name' 2>$null
            if ($prev -match '^catalog-(\d+)$') { $seq = [int]$Matches[1] + 1 } else { $seq = 1 }
          }
          "seq=$seq" >> "$env:GITHUB_OUTPUT"

      - name: Build every package
        run: node scripts/build-packages.mjs --out out --sequence ${{ steps.sequence.outputs.seq }}

      - name: Build catalog
        run: node scripts/build-catalog.mjs --packages out/packages.json --external-apps external-apps.json --sequence ${{ steps.sequence.outputs.seq }} --out out/catalog

      - name: Publish release catalog-${{ steps.sequence.outputs.seq }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "catalog-${{ steps.sequence.outputs.seq }}"
          gh release create $tag --title $tag --notes "Integrations catalog ${{ steps.sequence.outputs.seq }}" out/catalog/catalog.json out/catalog/SHA256SUMS.txt out/catalog/icon-*.png out/*.kspkg
