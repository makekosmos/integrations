name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain pins
        id: toolchain
        run: node -p "const t = require('./toolchain.json'); `node=${t.node}\nrust=${t.rust}`" >> "$env:GITHUB_OUTPUT"
        shell: pwsh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: Install Rust toolchain
        run: rustup toolchain install ${{ steps.toolchain.outputs.rust }} --profile minimal --component rustfmt --component clippy

      - name: Validate manifests and external apps
        run: node scripts/validate-manifests.mjs

      - name: Script tests
        run: npm test

      - name: Build every package
        run: node scripts/build-packages.mjs --out out --sequence 0

      - name: Test every package
        run: |
          Get-ChildItem packages -Directory | ForEach-Object {
            cargo test --manifest-path "$($_.FullName)/Cargo.toml" --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: pwsh

      - name: Catalog dry run
        run: node scripts/build-catalog.mjs --packages out/packages.json --external-apps external-apps.json --sequence 1 --out out/catalog
